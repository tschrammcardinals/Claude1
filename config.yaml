# Tennis arb strategy config.

strategy:
  # Initial offsets from fair (cents). The optimizer widens these if needed
  # to clear `target_net_per_contract_cents` after maker fees.
  bid_offset_cents: 4
  ask_offset_cents: 3

  # Required net profit per contract on a maker/maker round trip after fees.
  # 3c is conservative: at fair=50c, maker fees are ~0.44c per side, so a
  # 7c gross spread (4c bid + 3c ask) clears ~6.1c net per contract.
  target_net_per_contract_cents: 3.0

  # Stop placing new orders this many minutes before scheduled match start.
  cutoff_minutes_before_start: 5

  # Don't trade markets whose model fair price is outside this band — too
  # lopsided to be safely arbitrage-able.
  min_fair_price_cents: 15
  max_fair_price_cents: 85

risk:
  # Per-match cap (yes + no exposure summed).
  max_exposure_per_market: 100.0

  # Hard contract cap per side per market.
  max_contracts_per_side: 200

  # Daily loss cap. Trips the kill switch and halts new orders.
  max_daily_loss: 1000.0

  # Global exposure cap across all markets.
  max_global_exposure: 5000.0

monitor:
  poll_interval_seconds: 2.0

  # Kalshi tennis match series. Confirmed Apr 2026:
  #   - ATP single-match outcomes: KXATPMATCH
  #   - WTA single-match outcomes: KXWTAMATCH
  # Note: Kalshi also has tournament-winner and game-total markets under
  # other series tickers — we deliberately scope to single-match outcomes.
  series_tickers: ["KXATPMATCH", "KXWTAMATCH"]

  # Fallback keyword filter when series_tickers is empty.
  title_keywords: ["tennis", "atp", "wta"]

model:
  surface_alpha: 0.65
  k_factor: 32.0
  default_rating: 1500.0
  recency_half_life_days: 730

fees:
  # Kalshi fee schedule (Feb 2026):
  #   taker = ceil_to_cent(0.0700 * C * p * (1-p))
  #   maker = ceil_to_cent(0.0175 * C * p * (1-p))
  # Update these if Kalshi revises the schedule.
  maker_rate: 0.0175
  taker_rate: 0.0700
